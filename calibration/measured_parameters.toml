# Plant parameters of PlanarDyadBot that are measured on the robot rather than
# fitted. The calibration fixes these and searches only for the ones that a
# scale and a ruler cannot give (Ib, Iw, d in calibrate_plant.jl).
#
# The values below are the model defaults. Replace each one with a measurement
# and record the date. All units are SI.

# Body mass [kg]: everything above the wheel axis. Weigh the robot with the
# wheels removed. Include the battery, the boards, and the frame.
M = 0.922

# Wheel mass [kg]: both wheels and their tyres together. The planar model has
# one wheel that stands for the pair, so add the two.
m = 0.081

# Effective rolling radius [m]. Do not measure the tyre with a caliper: the
# model needs the radius that turns wheel rotation into travel. Roll the robot
# along a straight line over a measured distance and read the encoder counts,
# then R = distance / (2 * pi * revolutions). See counts_per_rev in the runtime
# options (1320 counts per revolution with steps-per-period=4, measured 2026-09-18;
# both wheels agreed within 1.1 % on a 0.62 m roll).
R = 0.0329

# Distance from the wheel axis to the body centre of mass [m]. Take the body off
# the wheels and balance it across a straight edge; the balance line is the
# centre of mass. Measure from there to the wheel axis.
L = 0.078

# ---------------------------------------------------------------------------
# Controller gains. These are NOT fitted: the robot runs a controller whose
# gains are known, and it is the plant that is unknown. The values below are the
# ones in options.toml on the robot on 2026-09-18 (device_manifest.toml defaults
# plus the [controller_params] overrides). Check them against
# options.toml on the robot before you fit a real log; a gain that is wrong here
# is absorbed into the fitted inertias.
#
# Ti = 1000 means the integral term is effectively off.
[controller]
k_angle = 1.2
Ti_angle = 30.0
Td_angle = 0.02
Nd_angle = 3.0
# Set-point weight of the angle-loop derivative: 0 = derivative on the measurement only
wd_angle = 0.0
# THESE MUST MATCH THE RUN BEING FITTED. They changed several times on
# 2026-09-18 and a fit against the wrong gains is worthless: the plant
# parameters silently absorb the mismatch, and the twin then falls over at the
# gains the robot actually runs. Values below are for run_amp10 onward.
k_pos = 0.05
Ti_pos = 6.0
Td_pos = 6.0
Nd_pos = 96.0
# Output limit of the position loop, rad. The model's own default is 25 degrees,
# which the robot has never used; it was lowered to 8 degrees on 2026-09-18 so
# that the outer loop's anti-windup engages at a lean the inner loop can really
# deliver. Gravity torque at 8 degrees is 0.098 N m against a 0.1 N m ceiling.
y_max_pos = 0.14

# ---------------------------------------------------------------------------
# Fitted by calibrate_plant.jl, listed here for reference only:
#
#   Ib   body moment of inertia about its centre of mass [kg m^2]
#   Iw   wheel + motor moment of inertia about the spin axis [kg m^2]
#   d    motor viscous friction between body and wheel [N m s/rad]
#
# The search starts from the geometry: the body as a uniform rod of length 2L
# and the wheels as a solid disc (see common.jl). Ib can be cross-checked with a
# pendulum test: hang the body from the wheel axis, time the small swing, and
# solve for the inertia. A fitted value far from that number means the fit has
# absorbed something else.

# ---------------------------------------------------------------------------
# How to read a robot log (robot_log_to_releases.jl). These describe the
# runtime that wrote the log, not the robot, so they change only with a rebuild.
[robot_log]
# Gyro-bias time constant of TiltEstimator, s. Set it to Inf to replay a log
# written before the bias state existed (anything before 2026-09-18 19:00).
T_bias = 20.0
# The runtime converts encoder counts to metres with the wheel radius baked into
# BalansBotDeploy (WheelPositionSensor.wheel_radius). Until that is rebuilt with
# the measured R, logged positions are off by R / wheel_radius_in_runtime.
wheel_radius_in_runtime = 0.0329
# Complementary tilt estimator of the deployed controller (TiltEstimator):
# raw = alpha * (raw_prev + Ts * gyro_y) + (1 - alpha) * atan(accel_x, accel_z),
# tilt = raw - angle_zero. angle_zero is the value in options.toml on the robot.
alpha = 0.995
# The zero tracker moves this DURING a run (30 s time constant) and writes the
# learned value back at shutdown, so no single number is exact. run_amp10 ended
# at -8.5596 and is 189 s long, so it sat there for most of the run. The
# residual is absorbed by the fitted theta_bias.
angle_zero_deg = -8.5596
Ts = 0.005
